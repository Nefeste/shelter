id: bike-weekend
name: Велопоход выходного дня
kind: ride
order: 3
words: { until: до похода, start: В путь, place: сумки, card: сумки }
text: >-
  Последние выходные июня. Папа, мама и сын едут на велосипедах с ночёвкой: в субботу утром —
  электричка за город, полсотни километров до озера, палатка на берегу; в воскресенье — ещё
  полсотни до другой станции и последняя электричка домой. Бабушка остаётся в городе и ждёт
  звонка. На сборы — два вечера после работы; всё, что взяли, — везти на себе.
