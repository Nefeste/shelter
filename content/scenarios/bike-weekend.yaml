sources:
  - pioner-bike
  - rpn-moscow-water
  - mr-energy-2021
  - pdd-bike
  - { assumption: "маршрут, станции, озеро и расписание электричек вымышлены; закат в 21:20, последняя электричка в 19:40" }
  - { assumption: "скорость в движении: асфальт 13 км/ч, грунт 10 км/ч, в дождь грунт на 30 % медленнее — из дневных норм «Пионера» для медленного темпа с привалами" }
  - { assumption: "груз до 14 кг на взрослый велосипед не замедляет; дальше — на 3 % за килограмм, за спиной — вдвое быстрее и вдвое сильнее, не больше 60 %" }
  - { assumption: "сын везёт половину доли взрослого" }
  - { assumption: "одежда, телефоны и мелочи — 10 кг на всех; на себе и в карманах — 10 л" }
  - { assumption: "дождь — на одном из этапов с вероятностью 50 %; ветер в день — встречный, попутный или тихо" }
  - { assumption: "прокол — 50 % на сто километров; серьёзная поломка без осмотра — 25 % за поездку; клещ без защиты — 35 %; падение с грузом на руле — 30 % на этапе" }
  - { assumption: "ночью у озера от +4 до +12 °C; спать тепло, если ночлег с утеплением даёт не меньше +18 °C" }
  - { assumption: "питьё в езде — 0,4 л в час взрослому и 0,3 л ребёнку, на стоянке — литр взрослому и 0,8 л ребёнку: в пределах 4–6 л в сутки по Роспотребнадзору" }
  - { assumption: "калории: 220 ккал в час езды взрослому и 180 ребёнку, ужин и завтрак у озера — 1300 и 1000 ккал; из суточных норм МР для высокой активности" }
  - { assumption: "после сырой воды из озера или испорченной в жару еды живот болит в шести случаях из десяти" }
  - { assumption: "прокол с ремнабором чинят за 30 минут, без него — 90 минут пешком до села" }
