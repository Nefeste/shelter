id: brevet-200
name: Бревет 200 км
kind: ride
order: 4
words: { until: до старта, start: На старт, place: сумки, card: сумки }
text: >-
  Конец апреля, суббота. Папа впервые едет бревет: двести километров за день, одному, своими
  силами. Старт в семь утра, три контрольных пункта в сёлах — у магазина или заправки, финиш там
  же, где старт. Каждый пункт закрывается в своё время: опоздал — бревет не засчитают. Мама с сыном
  дома ждут сообщений с каждого пункта. На сборы — два вечера; всё, что взял, — везти на себе.
