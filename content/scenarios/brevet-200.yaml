  - { assumption: "маршрут, сёла и время заката (20:00) вымышлены; старт в 7:00, три КП на 60, 115 и 160 км, финиш на 204 км" }
  - { assumption: "скорость одного ездока в движении — 25 км/ч по асфальту; остановка — 5 минут через полтора часа езды, на КП — 15 минут, на среднем — 30" }
  - { assumption: "груз до 8 кг не замедляет; дальше — на 3 % за килограмм, за спиной — вдвое быстрее и вдвое сильнее, не больше 60 %" }
  - { assumption: "одежда, телефон и мелочи — 3 кг; на себе и в карманах — 4 л" }
  - { assumption: "дождь — на одном из перегонов с вероятностью 50 %; ветер — встречный, попутный или тихо" }
  - { assumption: "прокол — 40 % на сто километров; серьёзная поломка без осмотра — 20 % за бревет; ночью фонарь садится с вероятностью 40 %" }
  - { assumption: "питьё — 0,5 л в час езды: в пределах 4–6 л в сутки по Роспотребнадзору" }
  - { assumption: "250 ккал в час езды — из суточной нормы МР для высокой активности" }
  - { assumption: "прокол с ремнабором чинят за 25 минут, без него — два часа пешком до села; в «моменте» не то — 10 минут на прокол, 5 на дождь" }
  - { assumption: "после сырой воды или испорченной еды живот болит в шести случаях из десяти" }
