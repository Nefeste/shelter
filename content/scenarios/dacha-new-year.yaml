text: >-
  Тридцатое декабря. Семья едет на дачу за полторы сотни километров — встретить Новый год и пожить
  до третьего января. Дом стоит пустой с осени: печь холодная, вода на зиму слита. Дрова под
  навесом есть, всё остальное — везти с собой. На сборы — вечер и утро, место — только багажник.
