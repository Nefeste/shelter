trouble:
  id: heat
  name: Тепло
  text: Без света встанет и отопление. Дом остывает за сутки-двое.
solutions:
  - id: heat-one-room
    tier: cheap
    name: Одна комната и одеяла
    text: Собраться всем в одной комнате, тепло одеться, остальные закрыть.
    goods: [{ good: blanket, qty: 2 }]
    workMin: 30
    heatC: 8
    why: Одна закрытая комната остывает медленнее всего дома, но в сильный мороз этого мало.
    sources: [mchs-tyva-utilities, { assumption: "на сколько градусов одна закрытая комната теплее улицы — допущение игры" }]
    review: draft
  - id: heat-gas-heater
    tier: mid
    name: Туристический газовый обогреватель
    text: Обогреватель на баллонах в одной утеплённой комнате. Ставится за час, запасные баллоны — во дворе.
    goods: [{ good: gas-heater, qty: 1 }, { good: gas-cartridge, qty: 56 }, { good: window-film, qty: 1 }]
    workMin: 60
    heatC: 37
    fuelHPerDay: 8
    risks: [co]
    creates: [co]
    why: Обогреватель греет, пока горит газ, но в закрытой комнате копится угарный газ.
    sources: [mchs-kuzbass-co, cpsc-co, mchs-gas-help, { assumption: "8 часов в сутки держат одну утеплённую комнату не холоднее +18 °C при −22 °C на улице — допущение игры" }]
    review: draft
  - id: heat-stove
    tier: right
    name: Печь и дрова
    text: Заводская печь с дымоходом наружу, негорючий лист перед топкой, дрова под навесом. Ставить дольше рабочего дня.
    goods: [{ good: stove, qty: 1 }, { good: firewood, qty: 21 }, { good: window-film, qty: 1 }]
    workMin: 480
    beforeEvent: true
    heatC: 38
    fuelHPerDay: 24
    risks: [co]
    creates: [co]
    why: Печь с дымоходом греет жилую часть дома и не зависит от света. Угарный газ бывает и у печи — заслонку закрывают, только когда над углями исчезнут синие огоньки.
    sources: [ppr-1479, sp-7-13130, mchs-kaluga-stove, { assumption: "прибавка температуры от печи — допущение игры" }]
    review: draft
  - id: heat-gas-stove
    tier: trap
    name: Греться газовой плитой
    text: Плита на кухне есть — включить конфорки и духовку на ночь.
    goods: []
    workMin: 0
    heatC: 18
    risks: [co]
    why: Газовая плита не для обогрева — в закрытой кухне копится угарный газ, а пламя может погаснуть.
    sources: [mchs-gas, mchs-kuzbass-co]
    review: draft
