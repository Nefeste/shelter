trouble:
  id: water
  name: Вода
  text: Насос и водопровод без света не работают. Воды нужно и на питьё, и на готовку с умыванием.
solutions:
  - id: water-drink
    tier: cheap
    name: Питьевая вода
    text: Бутилированная вода.
    goods: [{ good: water-5l, qty: 36 }]
    workMin: 0
    why: "Норма на питьё — 2,5 л взрослому и 5 л ребёнку в сутки; на готовку и умывание нужно ещё 7,5 л на человека."
    sources: [mchs-norms]
    review: draft
  - id: water-canisters
    tier: mid
    name: Вода и канистры из крана
    text: Бутилированная вода и канистры, наполненные из крана, пока он работает.
    goods: [{ good: water-5l, qty: 36 }, { good: canister-20l, qty: 10 }, { good: tap-water, qty: 10 }]
    workMin: 60
    beforeEvent: true
    why: Пока в кране есть вода, её набирают про запас для хозяйственных нужд — это почти ничего не стоит.
    sources: [mchs-kaluga-outage, mchs-norms]
    review: draft
  - id: water-full
    tier: right
    name: Вода и много канистр
    text: Бутилированная вода и канистры из крана — сколько поместится в кладовую.
    goods: [{ good: water-5l, qty: 36 }, { good: canister-20l, qty: 21 }, { good: tap-water, qty: 21 }]
    workMin: 90
    beforeEvent: true
    why: На семью из четырёх нужно больше 40 л в сутки — на две недели это сотни литров.
    sources: [mchs-norms, mchs-kaluga-outage]
    review: draft
  - id: water-porch
    tier: trap
    name: Канистры на веранде
    text: Места в доме мало — канистры поставить на веранду.
    goods: [{ good: water-5l, qty: 36 }, { good: canister-20l, qty: 10 }, { good: tap-water, qty: 10 }]
    workMin: 60
    beforeEvent: true
    keepsPct: 60
    why: На морозе вода замерзает — быстро её не достать, а полная канистра может лопнуть.
    sources: [ready-list, { assumption: "сколько воды теряется на морозе — допущение игры: 40 %" }]
    review: draft
