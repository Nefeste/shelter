trouble:
  id: fire
  name: Пожар
  text: Свечи и огонь в доме — риск пожара, а пожарные доедут не сразу.
solutions:
  - id: fire-holders
    tier: cheap
    name: Подсвечники и присмотр
    text: Свечи — в устойчивых подсвечниках, подальше от штор и постели, не оставлять одни.
    goods: []
    workMin: 15
    guards: [{ risk: fire, stopsPct: 60 }]
    why: Подставка и присмотр снижают риск, но ночью и с ребёнком в доме его не убрать совсем.
    sources: [mchs-khabarovsk-candles, ppr-1479, { assumption: "подставки и присмотр защищают на 60 %" }]
    review: draft
  - id: fire-extinguisher
    tier: mid
    name: Огнетушитель
    text: Порошковый огнетушитель на видном месте.
    goods: [{ good: extinguisher, qty: 1 }]
    workMin: 15
    guards: [{ risk: fire, stopsPct: 80 }]
    why: Огнетушитель гасит пожар в самом начале, если он под рукой.
    sources: [mchs-pskov-extinguisher, mchs-bashkiria-extinguisher, { assumption: "огнетушитель защищает на 80 %" }]
    review: draft
  - id: fire-both
    tier: right
    name: Подсвечники и огнетушитель
    text: Свечи в подсвечниках под присмотром, огнетушитель рядом.
    goods: [{ good: extinguisher, qty: 1 }]
    workMin: 30
    guards: [{ risk: fire, stopsPct: 90 }]
    why: Огонь под присмотром и огнетушитель рядом — так риск от свечей самый низкий, но открытый огонь в доме не бывает без риска.
    sources: [mchs-khabarovsk-candles, mchs-pskov-extinguisher, ppr-1479, { assumption: "подставки, присмотр и огнетушитель вместе защищают на 90 %" }]
    review: draft
  - id: fire-window
    tier: trap
    name: Свечи на подоконнике
    text: На подоконнике светлее и никому не мешают.
    goods: []
    workMin: 0
    why: У окна сквозняк клонит пламя, а рядом шторы — свечи держат подальше от окон и занавесок.
    sources: [mchs-khabarovsk-candles]
    review: draft
