trouble:
  id: co
  name: Угарный газ
  text: Всё, что горит в доме, даёт угарный газ. Он без цвета и запаха.
solutions:
  - id: co-airing
    tier: cheap
    name: Проветривать по расписанию
    text: Каждые несколько часов открывать окно на несколько минут.
    goods: []
    workMin: 0
    heatLossC: 2
    guards: [{ risk: co, stopsPct: 60 }]
    why: Проветривание уносит угарный газ, но ночью про него легко забыть, а дом выстывает.
    sources: [mchs-voronezh-co, { assumption: "проветривание по расписанию защищает частично — на 60 %" }]
    review: draft
  - id: co-sensor
    tier: mid
    name: Датчик угарного газа
    text: Датчик на батарейках у места, где спят, — пищит раньше, чем станет плохо.
    goods: [{ good: co-detector, qty: 1 }]
    workMin: 15
    guards: [{ risk: co, stopsPct: 90 }]
    why: Датчик замечает угарный газ задолго до того, как человек почувствует недомогание.
    sources: [mchs-stavropol-detector, cdc-co, { assumption: "датчик защищает на 90 % — допущение игры" }]
    review: draft
  - id: co-detector-airing
    tier: right
    name: Датчик и проветривание
    text: Датчик угарного газа и короткое проветривание утром и вечером.
    goods: [{ good: co-detector, qty: 1 }]
    workMin: 15
    heatLossC: 1
    guards: [{ risk: co, stopsPct: 100 }]
    why: Датчик предупреждает, а проветривание не даёт газу копиться.
    sources: [mchs-stavropol-detector, mchs-voronezh-co, cdc-co]
    review: draft
  - id: co-seal
    tier: trap
    name: Заделать всё наглухо
    text: Чтобы не уходило тепло — законопатить окна и двери и закрыть вентиляцию.
    goods: [{ good: window-film, qty: 1 }]
    workMin: 60
    why: Утеплить окна — правильно, но если в комнате горит обогреватель или печь, а щели и вентиляцию закрыли наглухо, угарному газу некуда уходить.
    sources: [mchs-kuzbass-co, mchs-tyva-utilities]
    review: draft
