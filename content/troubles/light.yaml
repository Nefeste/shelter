trouble:
  id: light
  name: Свет
  text: Зимой темнеет рано. Свет нужен хотя бы на 5 часов в сутки.
solutions:
  - id: light-candles
    tier: cheap
    name: Свечи
    text: Свечи хозяйственные — дёшево и светло.
    goods: [{ good: candles, qty: 2 }]
    workMin: 0
    risks: [fire]
    creates: [fire]
    why: Свечи дают свет, но открытый огонь в доме — риск пожара; без присмотра их не оставляют.
    sources: [mchs-khabarovsk-candles, ppr-1479]
    review: draft
  - id: light-headlamps
    tier: mid
    name: Налобные фонари
    text: Два налобных фонаря и батарейки.
    goods: [{ good: headlamp, qty: 2 }, { good: batteries, qty: 4 }]
    workMin: 0
    why: Фонари безопасны, но батареек нужно столько, чтобы хватило на все вечера, — а на холоде они садятся быстрее.
    sources: [mchs-kit, ready-outage]
    review: draft
  - id: light-lanterns
    tier: right
    name: Кемпинговый фонарь и налобные
    text: Фонарь на стол и налобные фонари с батарейками.
    goods: [{ good: lantern, qty: 1 }, { good: headlamp, qty: 2 }, { good: batteries, qty: 4 }]
    workMin: 0
    why: Свет на все вечера без огня — батареек по часам, а не на глаз.
    sources: [mchs-kit, ready-outage]
    review: draft
  - id: light-car
    tier: trap
    name: Заряжать фонари от машины
    text: Заводить машину в гараже и заряжать от неё фонарь и телефоны.
    goods: [{ good: headlamp, qty: 1 }]
    workMin: 0
    risks: [co]
    creates: [co]
    why: Работающий двигатель в гараже — частая причина отравления угарным газом; у пристроенного к дому гаража — даже с открытыми воротами.
    sources: [mchs-voronezh-co, mchs-kuzbass-co, cdc-co]
    review: draft
