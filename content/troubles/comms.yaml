trouble:
  id: comms
  name: Связь и новости
  text: Без света телефоны сядут, а вышки связи держатся на резервном питании недолго.
solutions:
  - id: comms-saving
    tier: cheap
    name: Телефон в экономии
    text: Включать телефон пару раз в день.
    goods: [{ good: own-phone, qty: 1 }]
    workMin: 0
    why: Экономия растягивает заряд на несколько дней, но не на две недели.
    sources: [mchs-yakutia-outage, { assumption: "на сколько дней хватает телефона — допущение игры" }]
    review: draft
  - id: comms-powerbanks
    tier: mid
    name: Внешние аккумуляторы
    text: Два внешних аккумулятора. Заказать заранее — доставка 1–2 дня.
    goods: [{ good: own-phone, qty: 1 }, { good: powerbank, qty: 2 }]
    workMin: 0
    why: Запасной аккумулятор для телефона — в списке того, что держат на случай отключения света.
    sources: [mchs-yakutia-outage, ready-outage]
    review: draft
  - id: comms-radio
    tier: right
    name: Радиоприёмник с динамо и аккумуляторы
    text: Радио узнает новости без связи и света, аккумуляторы — для звонков.
    goods: [{ good: own-phone, qty: 1 }, { good: crank-radio, qty: 1 }, { good: powerbank, qty: 2 }]
    workMin: 0
    why: Переносной приёмник с ручной зарядкой работает все две недели — по радио передают, когда и где помощь.
    sources: [mchs-kit, mchs-sverdlovsk-weather]
    review: draft
  - id: comms-trust
    tier: trap
    name: Связь и так будет
    text: Сотовая связь работает всегда — ничего не нужно.
    goods: [{ good: own-phone, qty: 1 }]
    keepsPct: 34
    workMin: 0
    why: Вышки связи без электричества держатся на аккумуляторах от десятков минут до нескольких часов — дальше связь пропадает.
    sources: [ofcom-ran-2025]
    review: draft
