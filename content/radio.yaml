# Районное радио (docs/08-game-design.md, «Жизнь мира»): вымышленные новости района по дням события.
# Слышно, только если в доме есть приёмник и он пришёл до события. Это не факты и не советы —
# без чисел (проверяет сборка), без названий настоящих станций и СМИ, без марок; источник не нужен.
# Строк — столько, сколько дней события.
- scenario: ice-rain
  days:
    - "Ледяной дождь оборвал провода в нескольких посёлках. Аварийные бригады выехали."
    - "Дороги во льду, техника идёт медленно. Энергетики просят набраться терпения."
    - "В поселковой школе открыт пункт обогрева: там тепло, горячий чай и можно зарядить телефон."
    - "Ночью сильный мороз. Бригады работают в две смены."
    - "Восстановлена линия к районной больнице. Посёлки — на очереди."
    - "Синоптики обещают оттепель. С крыш капает, на дорогах — ледяная каша."
    - "Волонтёры развозят воду пожилым жителям. Соседи помогают соседям."
    - "На помощь приехали бригады из соседних районов."
    - "Свет дали в центре. В посёлках ремонт продолжается."
    - "Снова похолодание. Пункт обогрева работает круглосуточно."
    - "На главной линии заменено больше половины опор."
    - "Мороз крепчает, но бригады уже на соседней улице."
    - "Ваш посёлок — в плане ремонта на завтра."
    - "Свет возвращается улица за улицей. Спасибо всем, кто помогал соседям."
