- { scenario: dacha-new-year, who: gran, when: "day:cold", text: "Внучек, неси второе одеяло." }
- { scenario: dacha-new-year, who: dad, when: "day:food", text: "Делим, что осталось, поровну." }
- { scenario: dacha-new-year, who: mom, when: "day:water", text: "Умываемся по очереди и по чуть-чуть." }
